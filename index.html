<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#78bdb2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Forced Self Care">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <title>Forced Self Care</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif;color:#294447;background:#edf6f4;line-height:1.4}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 0,#c9eee7 0,transparent 38%),radial-gradient(circle at 96% 9%,#f7ddd3 0,transparent 34%),linear-gradient(160deg,#f9fcfb,#f6f1fb);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input,textarea{font:inherit}.shell{max-width:560px;margin:auto;min-height:100vh;padding:22px 18px 100px}.brand{display:flex;align-items:center;gap:13px;margin:6px 0 25px}.brand img{width:62px;height:62px;border-radius:16px;box-shadow:0 8px 24px #5d8d8730}.brand h1{font-size:25px;margin:0;letter-spacing:-.5px}.brand p{margin:2px 0 0;color:#688084;font-size:13px}.card{background:#ffffffdf;border:1px solid #fff;border-radius:25px;padding:20px;box-shadow:0 13px 40px #617b821c;backdrop-filter:blur(12px);margin-bottom:15px}.hero{text-align:center;padding:28px 22px}.hero img{width:104px;height:104px;border-radius:28px;box-shadow:0 12px 30px #759a9638}.hero h2{font-size:25px;margin:17px 0 4px}.muted{color:#718589}.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:20px 0}.role{border:1.5px solid #dce9e7;background:#f9fcfb;border-radius:18px;padding:17px 10px;color:#38575a;font-weight:700}.role.active{border-color:#6cb7aa;background:#eaf7f4;color:#27685f}.pin{width:100%;text-align:center;letter-spacing:14px;font-size:28px;padding:15px;border:1.5px solid #d6e5e2;border-radius:17px;background:#fff;margin:10px 0}.primary,.secondary,.danger{width:100%;border:0;border-radius:16px;padding:15px;font-weight:750}.primary{background:linear-gradient(135deg,#5fb4a5,#839fc8);color:#fff;box-shadow:0 8px 20px #5e9d9440}.secondary{background:#edf5f3;color:#39645f}.danger{background:#fff0ef;color:#a24848}.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.badge{font-size:12px;font-weight:750;padding:7px 10px;border-radius:99px;background:#e9f6f3;color:#2d746a}.date{font-size:13px;color:#73878a}.progress{height:9px;background:#e7efee;border-radius:99px;overflow:hidden;margin:12px 0 5px}.progress span{display:block;height:100%;background:linear-gradient(90deg,#59b8a7,#8ca6d0);border-radius:99px}.med{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid #edf1f1}.med-icon{width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,#e4f7f3,#efeafa);display:grid;place-items:center;font-size:22px}.med h3{font-size:16px;margin:0}.med small{color:#7d8d90}.taken{color:#348274!important}.run_out,.not_taken{color:#b76258!important}.status{border:0;border-radius:13px;padding:10px 12px;background:#edf6f4;color:#356a64;font-weight:700;white-space:nowrap}.status.done{background:#dff3ed;color:#2c796b}.status.problem{background:#fff0ed;color:#a9574e}.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:7px 0 12px}.menu button{border:0;border-radius:13px;padding:11px 4px;font-size:12px;font-weight:700}.yes{background:#e0f4ee;color:#2e796d}.out{background:#fff1e8;color:#a85f37}.no{background:#f7ecef;color:#98566a}.event{padding:11px 0;border-bottom:1px solid #edf1f1}.event b{display:block;font-size:14px}.event small{color:#7b8d90}.notice{border-left:4px solid #d59d75;background:#fff8ef;padding:13px;border-radius:12px;color:#825d43;font-size:13px;margin:12px 0}.nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(520px,calc(100% - 28px));display:grid;grid-template-columns:repeat(3,1fr);padding:7px;background:#ffffffed;border:1px solid #fff;border-radius:20px;box-shadow:0 12px 35px #435b6230;backdrop-filter:blur(15px)}.nav button{border:0;background:transparent;padding:10px 4px;border-radius:13px;color:#708488;font-size:12px;font-weight:700}.nav button.active{background:#e8f4f2;color:#36756c}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#20363866;display:grid;align-items:end;z-index:20}.sheet{background:#fff;border-radius:28px 28px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));max-width:560px;width:100%;margin:auto}.sheet h3{margin:0 0 6px}.sheet textarea{width:100%;min-height:95px;border:1.5px solid #d6e5e2;border-radius:15px;padding:13px;margin:12px 0}.error{color:#ad4d4d;font-size:13px;min-height:19px}.stack{display:grid;gap:10px}.empty{text-align:center;padding:27px;color:#7c8d90}@media(max-width:360px){.status{padding:9px 8px}.med{grid-template-columns:40px 1fr auto}.med-icon{width:40px;height:40px}}
  </style>
</head>
<body>
  <main class="shell"><header class="brand"><img src="icon.png" alt=""><div><h1>Forced Self Care</h1><p id="subtitle">A calmer daily routine</p></div></header><section id="app"></section></main>
  <div id="modal" class="modal hidden"></div>
  <script>
    const API='https://edgcpbdzklsfvvqlolsw.supabase.co/functions/v1/forced-self-care';
    const app=document.querySelector('#app'),modal=document.querySelector('#modal');let role='monitor',sessionToken=localStorage.getItem('fsc_session')||'',state=null;
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function api(action,data={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-fsc-session':sessionToken},body:JSON.stringify({action,...data})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Something went wrong');return j}
    function setupScreen(){app.innerHTML='<section class="card hero"><img src="icon.png"><h2>Create your private PINs</h2><p class="muted">Set one PIN for your monitoring phone and another for the medication taker.</p><div class="stack"><input id="mp" class="pin" inputmode="numeric" maxlength="4" type="password" placeholder="••••" aria-label="Monitor PIN"><input id="tp" class="pin" inputmode="numeric" maxlength="4" type="password" placeholder="••••" aria-label="Medication taker PIN"><button class="primary" id="create">Create Forced Self Care</button><div class="error" id="err"></div></div></section>';document.querySelector('#create').onclick=async()=>{try{const setupToken=new URLSearchParams(location.search).get('setup')||'';const j=await api('setup',{setupToken,monitorPin:mp.value,takerPin:tp.value});sessionToken=j.token;localStorage.setItem('fsc_session',sessionToken);history.replaceState({},'',location.pathname);await load()}catch(e){err.textContent=e.message}}}
    function loginScreen(){app.innerHTML='<section class="card hero"><img src="icon.png"><h2>Welcome back</h2><p class="muted">Choose your role and enter your 4-digit PIN.</p><div class="role-grid"><button class="role active" data-role="monitor">Monitor</button><button class="role" data-role="taker">Medication taker</button></div><input id="pin" class="pin" inputmode="numeric" maxlength="4" type="password" placeholder="••••"><button class="primary" id="login">Unlock app</button><div class="error" id="err"></div></section>';document.querySelectorAll('.role').forEach(b=>b.onclick=()=>{role=b.dataset.role;document.querySelectorAll('.role').forEach(x=>x.classList.toggle('active',x===b))});login.onclick=async()=>{try{const j=await api('login',{role,pin:pin.value});sessionToken=j.token;localStorage.setItem('fsc_session',sessionToken);await load()}catch(e){err.textContent=e.message}}}
    function medCard(m){const status=m.status||'',label=status==='taken'?'Taken':status==='run_out'?'Run out':status==='not_taken'?'Not taken':'Confirm';return '<div class="med"><div class="med-icon">'+(status==='taken'?'✓':'◌')+'</div><div><h3>'+esc(m.name)+'</h3><small class="'+status+'">'+(m.reason?esc(m.reason):status==='taken'?'Confirmed '+new Date(m.updated_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'Daily')+'</small></div><button class="status '+(status==='taken'?'done':status?'problem':'')+'" onclick="toggleMenu('+m.id+')">'+label+'</button></div><div id="menu-'+m.id+'" class="menu hidden"><button class="yes" onclick="setStatus('+m.id+',\'taken\')">Taken</button><button class="out" onclick="reason('+m.id+',\'run_out\')">Run out</button><button class="no" onclick="reason('+m.id+',\'not_taken\')">Not taken</button></div>'}
    function mainScreen(){const taken=state.medications.filter(m=>m.status==='taken').length,total=state.medications.length,pct=Math.round(taken/total*100);app.innerHTML='<section id="today"><div class="topline"><span class="badge">'+(state.role==='monitor'?'Monitor':'Medication taker')+'</span><span class="date">'+new Date(state.date+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})+'</span></div><section class="card"><div class="topline"><div><b>Today’s self care</b><div class="muted">'+taken+' of '+total+' taken</div></div><b>'+pct+'%</b></div><div class="progress"><span style="width:'+pct+'%"></span></div>'+state.medications.map(medCard).join('')+'</section>'+(state.role==='monitor'&&state.purchases.length?'<section class="card"><b>To buy</b>'+state.purchases.map(p=>'<div class="event"><b>'+esc(p.medication_name)+'</b><small>Reminder due '+new Date(p.due_date+'T14:00').toLocaleDateString('en-GB')+' at 2:00 pm</small></div>').join('')+'</section>':'')+'</section><section id="history" class="hidden"><section class="card"><b>Recent activity</b>'+(state.events.length?state.events.map(e=>'<div class="event"><b>'+esc(e.message)+'</b><small>'+new Date(e.created_at).toLocaleString('en-GB')+'</small></div>').join(''):'<div class="empty">No activity yet</div>')+'</section></section><section id="settings" class="hidden"><section class="card"><b>Account</b><p class="muted">Signed in as '+(state.role==='monitor'?'Monitor':'Medication taker')+'</p>'+(state.role==='monitor'?'<div class="notice">Only the Monitor account can reset the taker PIN or manage reminders.</div><button class="secondary" onclick="resetPin()">Reset medication-taker PIN</button>':'<div class="notice">Reminder controls are locked on this account.</div>')+'<button class="danger" style="margin-top:10px" onclick="logout()">Log out</button></section><section class="card"><b>Reminders</b><p>10:00 pm daily<br>11:00 pm if anything remains incomplete<br>2:00 pm next day when something runs out</p><div class="notice">Install this app on both iPhones. Background notification delivery will be enabled after setup.</div></section></section><nav class="nav"><button class="active" onclick="tab(\'today\',this)">Today</button><button onclick="tab(\'history\',this)">History</button><button onclick="tab(\'settings\',this)">Settings</button></nav>';document.querySelector('#subtitle').textContent=state.role==='monitor'?'Monitoring today’s routine':'Your daily routine'}
    window.toggleMenu=id=>document.querySelector('#menu-'+id).classList.toggle('hidden');
    window.setStatus=async(id,status,reason='')=>{try{await api('update',{medicationId:id,status,reason});await load()}catch(e){alert(e.message)}};
    window.reason=(id,status)=>{const name=state.medications.find(m=>m.id===id)?.name||'Medication';modal.classList.remove('hidden');modal.innerHTML='<div class="sheet"><h3>'+esc(status==='run_out'?name+' has run out':'Why was '+name+' not taken?')+'</h3><p class="muted">A reason is required and the Monitor will see it.</p><textarea id="why" placeholder="Enter the reason"></textarea><div class="stack"><button class="primary" id="saveReason">Save reason</button><button class="secondary" onclick="closeModal()">Cancel</button></div></div>';saveReason.onclick=()=>{if(!why.value.trim())return alert('Please enter a reason');closeModal();setStatus(id,status,why.value.trim())}};
    window.closeModal=()=>{modal.classList.add('hidden');modal.innerHTML=''};
    window.tab=(id,b)=>{['today','history','settings'].forEach(x=>document.querySelector('#'+x).classList.toggle('hidden',x!==id));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b))};
    window.resetPin=()=>{modal.classList.remove('hidden');modal.innerHTML='<div class="sheet"><h3>Reset medication-taker PIN</h3><input id="newpin" class="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"><div class="stack"><button class="primary" id="savePin">Save new PIN</button><button class="secondary" onclick="closeModal()">Cancel</button></div></div>';savePin.onclick=async()=>{try{await api('reset_taker_pin',{pin:newpin.value});closeModal();alert('Medication-taker PIN updated')}catch(e){alert(e.message)}}};
    window.logout=async()=>{try{await api('logout')}catch{}localStorage.removeItem('fsc_session');sessionToken='';loginScreen()};
    async function load(){try{state=await api('state');mainScreen()}catch{localStorage.removeItem('fsc_session');sessionToken='';loginScreen()}}
    (async()=>{try{const s=await api('status');if(!s.initialized){if(new URLSearchParams(location.search).has('setup'))setupScreen();else app.innerHTML='<section class="card hero"><img src="icon.png"><h2>Setup link required</h2><p class="muted">Open the private setup link on the Monitor phone first.</p></section>'}else if(sessionToken)await load();else loginScreen()}catch(e){app.innerHTML='<section class="card"><b>Unable to open app</b><p>'+esc(e.message)+'</p></section>'}})();
    if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  </script>
</body>
</html>
