<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#78bdb2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Forced Self Care">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <title>Forced Self Care</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif;color:#e8f3f1;background:#111820;line-height:1.4;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 0,#174b4a 0,transparent 40%),radial-gradient(circle at 96% 8%,#50343f 0,transparent 36%),linear-gradient(160deg,#111820,#191827 68%,#121a22);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input,textarea{font:inherit}.shell{max-width:560px;margin:auto;min-height:100vh;padding:22px 18px 100px}.brand{display:flex;align-items:center;gap:13px;margin:6px 0 25px}.brand img{width:62px;height:62px;border-radius:16px;box-shadow:0 8px 28px #0008;animation:heartBeat 2.6s ease-in-out infinite;transform-origin:center}@keyframes heartBeat{0%,76%,100%{transform:scale(1)}82%{transform:scale(1.07)}88%{transform:scale(1)}93%{transform:scale(1.045)}}@keyframes messageHeartBeat{0%,62%,100%{transform:scale(1)}70%{transform:scale(1.18)}78%{transform:scale(.98)}86%{transform:scale(1.13)}94%{transform:scale(1)}}@media(prefers-reduced-motion:reduce){.brand img,.love-quote .heart{animation:none}}.brand h1{font-size:25px;margin:0;letter-spacing:-.5px}.brand p{margin:2px 0 0;color:#9bb1b1;font-size:13px}.card{background:#202932e8;border:1px solid #ffffff12;border-radius:25px;padding:20px;box-shadow:0 13px 40px #0005;backdrop-filter:blur(12px);margin-bottom:15px}.hero{text-align:center;padding:28px 22px}.hero img{width:104px;height:104px;border-radius:28px;box-shadow:0 12px 30px #0007}.hero h2{font-size:25px;margin:17px 0 4px}.muted{color:#9aadaf}.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:20px 0}.role{border:1.5px solid #3b4b51;background:#1b242c;border-radius:18px;padding:17px 10px;color:#b7ccca;font-weight:700}.role.active{border-color:#69bcae;background:#1c3b3a;color:#9be1d6}.pin{width:100%;text-align:center;letter-spacing:14px;font-size:28px;padding:15px;border:1.5px solid #405057;border-radius:17px;background:#141c23;color:#fff;margin:10px 0}.primary,.secondary,.danger{width:100%;border:0;border-radius:16px;padding:15px;font-weight:750}.primary{background:linear-gradient(135deg,#438f85,#687faa);color:#fff;box-shadow:0 8px 20px #0005}.secondary{background:#2c393f;color:#bfe0db}.danger{background:#3a2529;color:#f0adb0}.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.badge{font-size:12px;font-weight:750;padding:7px 10px;border-radius:99px;background:#203f3d;color:#91d9ce}.date{font-size:13px;color:#9badb0}.progress{height:9px;background:#344147;border-radius:99px;overflow:hidden;margin:12px 0 5px}.progress span{display:block;height:100%;background:linear-gradient(90deg,#59b8a7,#8ca6d0);border-radius:99px}.med{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid #ffffff12}.med-icon{width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,#23423e,#352f4c);display:grid;place-items:center;font-size:22px}.med h3{font-size:16px;margin:0}.med small{color:#98a9ab}.taken{color:#77cbbb!important}.run_out,.not_taken{color:#e0998e!important}.med-actions{display:grid;gap:5px}.status{border:0;border-radius:13px;padding:10px 12px;background:#2b3a3f;color:#9dd5cd;font-weight:700;white-space:nowrap}.status.done{background:#21423b;color:#87d5c6}.status.problem{background:#462d2d;color:#efaaa0}.quick-reset{border:0;background:transparent;color:#c5acd0;font-size:12px;font-weight:750;padding:4px}.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:7px 0 12px}.menu.monitor-menu{grid-template-columns:1fr}.menu button{border:0;border-radius:13px;padding:11px 4px;font-size:12px;font-weight:700}.yes{background:#21423b;color:#8bd5c7}.out{background:#49372c;color:#efb58c}.no{background:#422f38;color:#e4a9bc}.event{padding:11px 0;border-bottom:1px solid #ffffff12}.event b{display:block;font-size:14px}.event small{color:#94a6a8}.notice{border-left:4px solid #c28c69;background:#392f29;padding:13px;border-radius:12px;color:#e7c4aa;font-size:13px;margin:12px 0}.love-quote{text-align:center;background:linear-gradient(145deg,#243039e8,#30263ae8);border:1px solid #d6b3df24}.love-quote .heart{display:inline-block;font-size:28px;line-height:1;color:#ff5263;text-shadow:0 0 12px #ff526399;margin-bottom:8px;animation:messageHeartBeat 1.8s ease-in-out infinite;transform-origin:center}.love-quote blockquote{margin:6px 0 0;color:#ead9eb;font-size:16px;font-style:italic}.love-quote small{color:#bcaac0}.nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(520px,calc(100% - 28px));display:grid;grid-template-columns:repeat(3,1fr);padding:7px;background:#202932f2;border:1px solid #ffffff16;border-radius:20px;box-shadow:0 12px 35px #0008;backdrop-filter:blur(15px)}.nav button{border:0;background:transparent;padding:10px 4px;border-radius:13px;color:#93a5a8;font-size:12px;font-weight:700}.nav button.active{background:#29413f;color:#9bd7cf}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#080d11b8;display:grid;align-items:end;z-index:20}.sheet{background:#202932;border-radius:28px 28px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));max-width:560px;width:100%;margin:auto}.sheet h3{margin:0 0 6px}.sheet textarea{width:100%;min-height:95px;border:1.5px solid #405057;border-radius:15px;padding:13px;margin:12px 0;background:#141c23;color:#fff}.error{color:#f09b9b;font-size:13px;min-height:19px}.stack{display:grid;gap:10px}.empty{text-align:center;padding:27px;color:#9aadaf}@media(max-width:360px){.status{padding:9px 8px}.med{grid-template-columns:40px 1fr auto}.med-icon{width:40px;height:40px}}
    .love-quote .heart{display:block!important;width:100%!important;margin:0 0 8px!important;text-align:center!important}
    .med.magnesium-separated{margin-top:30px;padding-top:24px;border-top:2px solid #ffffff20}
  </style>
</head>
<body>
  <main class="shell"><header class="brand"><img src="icon.png" alt=""><div><h1>Forced Self Care</h1><p id="subtitle">A calmer daily routine</p></div></header><section id="app"></section></main>
  <div id="modal" class="modal hidden"></div>
  <script>
    const API='https://edgcpbdzklsfvvqlolsw.supabase.co/functions/v1/forced-self-care';
    const app=document.querySelector('#app'),modal=document.querySelector('#modal');let sessionToken=localStorage.getItem('fsc_session')||'',state=null,lockTimer=null;
    const privateSetupToken=()=>new URLSearchParams(location.hash.replace(/^#/, '')).get('setup')||'';
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function api(action,data={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'text/plain;charset=UTF-8'},body:JSON.stringify({action,sessionToken,...data})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Something went wrong');return j}
    function setupScreen(){app.innerHTML='<section class="card hero"><img src="icon.png"><h2>Create your private PINs</h2><p class="muted">Set one PIN for your monitoring phone and another for the medication taker.</p><div class="stack"><input id="mp" class="pin" inputmode="numeric" maxlength="4" type="password" placeholder="••••" aria-label="Monitor PIN"><input id="tp" class="pin" inputmode="numeric" maxlength="4" type="password" placeholder="••••" aria-label="Medication taker PIN"><button class="primary" id="create">Create Forced Self Care</button><div class="error" id="err"></div></div></section>';document.querySelector('#create').onclick=async()=>{try{const setupToken=privateSetupToken();const j=await api('setup',{setupToken,monitorPin:mp.value,takerPin:tp.value});sessionToken=j.token;localStorage.setItem('fsc_session',sessionToken);history.replaceState({},'',location.pathname);await load()}catch(e){err.textContent=e.message}}}
    function loginScreen(){app.innerHTML='<section class="card hero"><img src="icon.png"><h2>Welcome back</h2><p class="muted">Enter your 4-digit PIN.</p><input id="pin" class="pin" inputmode="numeric" maxlength="4" type="password" placeholder="••••"><button class="primary" id="login">Unlock app</button><div class="error" id="err"></div></section>';login.onclick=async()=>{try{const j=await api('login',{pin:pin.value});sessionToken=j.token;localStorage.setItem('fsc_session',sessionToken);localStorage.removeItem('fsc_hidden_at');await load()}catch(e){err.textContent=e.message}}}
    function medCard(m){const status=m.status||'',monitor=state.role==='monitor',label=status==='taken'?'Taken':status==='run_out'?'Run out':status==='not_taken'?'Not taken':monitor?'Waiting':'Confirm',reset=monitor&&status?'<button class="quick-reset" onclick="resetMedication('+m.id+')">Reset</button>':'',choices='<button class="yes" onclick="setStatus('+m.id+',\'taken\')">Taken</button><button class="out" onclick="reason('+m.id+',\'run_out\')">Run out</button><button class="no" onclick="reason('+m.id+',\'not_taken\')">Not taken</button>',detail=m.reason?(monitor?'<small class="'+status+'"><b>Taker’s explanation:</b> '+esc(m.reason)+'</small>':'<small class="'+status+'">'+esc(m.reason)+'</small>'):'<small class="'+status+'">'+(status==='taken'?'Confirmed '+new Date(m.updated_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'Daily')+'</small>',statusAction=monitor?' disabled':' onclick="toggleMenu('+m.id+')"',menu=monitor?'':'<div id="menu-'+m.id+'" class="menu hidden">'+choices+'</div>';return '<div class="med"><div class="med-icon">'+(status==='taken'?'✓':'◌')+'</div><div><h3>'+esc(m.name)+'</h3>'+detail+'</div><div class="med-actions"><button class="status '+(status==='taken'?'done':status?'problem':'')+'"'+statusAction+'>'+label+'</button>'+reset+'</div></div>'+menu}
    const notificationRow=role=>(state.notificationStatus||[]).find(row=>row.role===role);
    const notificationLine=role=>{const row=notificationRow(role),name=role==='monitor'?'Monitor phone':'Medication-taker phone';return '<div class="event"><b>'+name+': '+(row?.enabled?'Enabled':'Not enabled')+'</b><small>'+(row?.checked_at?'Last checked '+new Date(row.checked_at).toLocaleString('en-GB'):'This phone has not connected yet')+'</small></div>'};
    const loveQuotes=['You are my favourite part of every day.','Even ordinary days feel special because you are in them.','My heart feels at home whenever I think of you.','You are loved today, tomorrow and always.','Looking after yourself means caring for the heart that I love.','Every day with you is a beautiful part of my story.','Your smile is still my favourite kind of sunshine.','I would choose you in every lifetime.','You make my world softer, warmer and brighter.','Home is not a place; it is wherever I am with you.','You are the calm my heart always looks for.','Loving you is the easiest thing my heart has ever done.','You make the smallest moments feel unforgettable.','My favourite future is any future that has you in it.','Your love makes every day worth celebrating.','I still fall for you in a hundred little ways.','You are the thought that makes my heart smile.','No matter how busy life becomes, my heart always finds you.','You are my safe place and my sweetest adventure.','The best part of today is knowing you are in my life.','Your love is the quiet magic behind my happiest days.','You are precious to me in more ways than words can hold.','My heart chooses you, again and again.','With you, even silence feels full of love.','Thank you for being the beautiful soul that you are.','You make love feel gentle, strong and true.','Every beat of my heart carries a little more love for you.','I love the life we are creating, one day at a time.','You are not just loved; you are deeply treasured.','Whatever today brings, remember that my heart is with you.','You will always be one of the best things that ever happened to me.'];
    const quoteOfDay=()=>{const day=Math.floor(Date.parse(state.date+'T00:00:00Z')/86400000);return loveQuotes[((day%loveQuotes.length)+loveQuotes.length)%loveQuotes.length]};
    function mainScreen(){const taken=state.medications.filter(m=>m.status==='taken').length,total=state.medications.length,pct=Math.round(taken/total*100),own=notificationRow(state.role),notificationButton=own?.enabled?'<button class="secondary" disabled>Notifications enabled on this iPhone</button>':'<button class="primary" id="notificationButton" onclick="enableNotifications()">Enable notifications on this iPhone</button>',health=state.role==='monitor'?'<section class="card"><b>Notification protection</b>'+notificationLine('monitor')+notificationLine('taker')+'<div class="notice">If the taker phone reports notifications are off, the Monitor is alerted. Apple still allows the iPhone owner to change notification settings.</div></section>':'',quote='<section class="card love-quote"><div class="heart">♡</div><small>'+(state.role==='monitor'?'Today’s message for her':'A message from me to you')+'</small><blockquote>“'+esc(quoteOfDay())+'”</blockquote><small>From me, with all my love ♡</small></section>';app.innerHTML='<section id="today"><div class="topline"><span class="badge">'+(state.role==='monitor'?'Monitor':'Medication taker')+'</span><span class="date">'+new Date(state.date+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})+'</span></div><section class="card"><div class="topline"><div><b>Today’s self care</b><div class="muted">'+taken+' of '+total+' taken</div></div><b>'+pct+'%</b></div><div class="progress"><span style="width:'+pct+'%"></span></div>'+state.medications.map(medCard).join('')+'</section>'+(state.role==='monitor'&&state.purchases.length?'<section class="card"><b>To buy</b>'+state.purchases.map(p=>'<div class="event"><b>'+esc(p.medication_name)+'</b><small>Reminder due '+new Date(p.due_date+'T14:00').toLocaleDateString('en-GB')+' at 2:00 pm</small></div>').join('')+'</section>':'')+quote+'</section><section id="history" class="hidden"><section class="card"><b>Recent activity</b>'+(state.events.length?state.events.map(e=>'<div class="event"><b>'+esc(e.message)+'</b><small>'+new Date(e.created_at).toLocaleString('en-GB')+'</small></div>').join(''):'<div class="empty">No activity yet</div>')+'</section></section><section id="settings" class="hidden"><section class="card"><b>Account</b><p class="muted">Signed in as '+(state.role==='monitor'?'Monitor':'Medication taker')+'</p>'+(state.role==='monitor'?'<div class="notice">Only the Monitor account can reset the taker PIN or manage reminders.</div><button class="secondary" onclick="resetPin()">Reset medication-taker PIN</button>':'<div class="notice">Reminder controls are locked on this account. There is no option here to turn notifications off.</div>')+'<button class="danger" style="margin-top:10px" onclick="logout()">Log out</button></section><section class="card"><b>Reminders</b><p>Morning medication: 8:00 am, 8:30 am and 8:45 am<br>Magnesium: 10:00 pm, 10:30 pm and 11:00 pm<br>Run-out purchase reminder: 2:00 pm next day</p>'+notificationButton+'<div class="notice">Medication reminders are sent to the taker. The Monitor is notified when medication is recorded as taken. Keep notifications, sounds and vibration allowed in iPhone Settings.</div></section>'+health+'</section><nav class="nav"><button class="active" onclick="tab(\'today\',this)">Today</button><button onclick="tab(\'history\',this)">History</button><button onclick="tab(\'settings\',this)">Settings</button></nav>';document.querySelector('#subtitle').textContent=state.role==='monitor'?'Monitoring today’s routine':'Your daily routine'}
    window.toggleMenu=id=>document.querySelector('#menu-'+id).classList.toggle('hidden');
    window.setStatus=async(id,status,reason='')=>{try{await api('update',{medicationId:id,status,reason});await load()}catch(e){alert(e.message)}};
    window.resetMedication=async id=>{const name=state.medications.find(m=>m.id===id)?.name||'this medication';if(!confirm('Reset '+name+' for today?'))return;try{await api('reset_medication_status',{medicationId:id});await load()}catch(e){alert(e.message)}};
    window.reason=(id,status)=>{const name=state.medications.find(m=>m.id===id)?.name||'Medication';modal.classList.remove('hidden');modal.innerHTML='<div class="sheet"><h3>'+esc(status==='run_out'?name+' has run out':'Why was '+name+' not taken?')+'</h3><p class="muted">A reason is required and the Monitor will see it.</p><textarea id="why" placeholder="Enter the reason"></textarea><div class="stack"><button class="primary" id="saveReason">Save reason</button><button class="secondary" onclick="closeModal()">Cancel</button></div></div>';saveReason.onclick=()=>{const explanation=document.querySelector('#why').value.trim();if(!explanation)return alert('Please enter a reason');closeModal();setStatus(id,status,explanation)}};
    window.closeModal=()=>{modal.classList.add('hidden');modal.innerHTML=''};
    window.tab=(id,b)=>{['today','history','settings'].forEach(x=>document.querySelector('#'+x).classList.toggle('hidden',x!==id));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b))};
    function addMonitorPinButton(){if(state.role!=='monitor')return;const takerButton=[...document.querySelectorAll('#settings button')].find(button=>button.textContent.includes('Reset medication-taker PIN'));if(takerButton)takerButton.insertAdjacentHTML('beforebegin','<button class="secondary" style="margin-bottom:10px" onclick="resetMonitorPin()">Change my Monitor PIN</button>')}
    const lockDelay=()=>Number(localStorage.getItem('fsc_lock_delay'))===30?30:10;
    function addAutoLockSettings(){const settings=document.querySelector('#settings');if(!settings)return;settings.insertAdjacentHTML('beforeend','<section class="card"><b>Automatic lock</b><p class="muted">Ask for the PIN after leaving or closing the app.</p><div class="stack"><button id="lock10" class="'+(lockDelay()===10?'primary':'secondary')+'" onclick="setLockDelay(10)">After 10 seconds</button><button id="lock30" class="'+(lockDelay()===30?'primary':'secondary')+'" onclick="setLockDelay(30)">After 30 seconds</button></div></section>')}
    window.setLockDelay=seconds=>{localStorage.setItem('fsc_lock_delay',String(seconds));document.querySelector('#lock10').className=seconds===10?'primary':'secondary';document.querySelector('#lock30').className=seconds===30?'primary':'secondary'};
    function lockApp(){if(!sessionToken)return;sessionToken='';localStorage.removeItem('fsc_session');localStorage.removeItem('fsc_hidden_at');loginScreen()}
    function shouldLock(){const hiddenAt=Number(localStorage.getItem('fsc_hidden_at')||0);return hiddenAt>0&&Date.now()-hiddenAt>=lockDelay()*1000}
    window.resetMonitorPin=()=>{modal.classList.remove('hidden');modal.innerHTML='<div class="sheet"><h3>Change my Monitor PIN</h3><p class="muted">Enter a new 4-digit PIN for your Monitor account.</p><input id="newMonitorPin" class="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"><div class="stack"><button class="primary" id="saveMonitorPin">Save new PIN</button><button class="secondary" onclick="closeModal()">Cancel</button></div></div>';saveMonitorPin.onclick=async()=>{try{const j=await api('reset_monitor_pin',{pin:newMonitorPin.value});sessionToken=j.token;localStorage.setItem('fsc_session',sessionToken);closeModal();alert('Your Monitor PIN has been updated')}catch(e){alert(e.message)}}};
    window.resetPin=()=>{modal.classList.remove('hidden');modal.innerHTML='<div class="sheet"><h3>Reset medication-taker PIN</h3><input id="newpin" class="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"><div class="stack"><button class="primary" id="savePin">Save new PIN</button><button class="secondary" onclick="closeModal()">Cancel</button></div></div>';savePin.onclick=async()=>{try{await api('reset_taker_pin',{pin:newpin.value});closeModal();alert('Medication-taker PIN updated')}catch(e){alert(e.message)}}};
    window.logout=async()=>{try{await api('logout')}catch{}localStorage.removeItem('fsc_session');sessionToken='';loginScreen()};
    const keyBytes=value=>{const padding='='.repeat((4-value.length%4)%4),base64=(value+padding).replace(/-/g,'+').replace(/_/g,'/'),raw=atob(base64);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)))};
    async function reportNotificationHealth(){let permission='unsupported',hasSubscription=false;try{if('Notification' in window)permission=Notification.permission;if('serviceWorker' in navigator&&'PushManager' in window){const registration=await navigator.serviceWorker.ready;hasSubscription=!!(await registration.pushManager.getSubscription())}}catch{}await api('notification_health',{permission,hasSubscription})}
    window.enableNotifications=async()=>{const button=document.querySelector('#notificationButton');try{if(!('serviceWorker' in navigator)||!('PushManager' in window))throw new Error('Open the installed Home Screen app to enable notifications');button.disabled=true;button.textContent='Enabling…';const permission=await Notification.requestPermission();if(permission!=='granted')throw new Error('Notifications were not allowed on this iPhone');const registration=await navigator.serviceWorker.ready;const key=await api('push_public_key');let subscription=await registration.pushManager.getSubscription();if(!subscription)subscription=await registration.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:keyBytes(key.publicKey)});await api('subscribe_push',{subscription:subscription.toJSON()});await api('send_test_push',{endpoint:subscription.endpoint});await load();alert('A test notification has been sent to this iPhone')}catch(e){button.disabled=false;button.textContent='Enable notifications on this iPhone';alert(e.message)}};
    async function syncAppBadge(){try{if(!('serviceWorker' in navigator))return;const registration=await navigator.serviceWorker.ready;registration.active?.postMessage({type:'SET_ROLE',role:state.role});if(state.role==='monitor'){if('clearAppBadge' in navigator)await navigator.clearAppBadge();registration.active?.postMessage({type:'CLEAR_BADGE'})}}catch{}}
    function restorePulsingHeart(){const heart=document.querySelector('.love-quote .heart');if(!heart)return;heart.textContent='♥';heart.setAttribute('aria-label','Pulsing heart')}
    function updateReminderScheduleText(){document.querySelectorAll('#settings .card p').forEach(p=>{if(p.textContent.includes('Morning medication:'))p.innerHTML='Daytime medication: every hour from 8:30 am until 3:00 pm<br>Magnesium: 10:00 pm, 10:30 pm and 11:00 pm<br>Run-out purchase reminder: 2:00 pm next day'})}
    function placeMagnesiumLast(){state.medications=[...state.medications].sort((a,b)=>Number(a.name==='Magnesium')-Number(b.name==='Magnesium'))}
    function separateMagnesium(){const heading=[...document.querySelectorAll('#today .med h3')].find(h=>h.textContent.trim()==='Magnesium');heading?.closest('.med')?.classList.add('magnesium-separated')}
    async function load(){try{await reportNotificationHealth();state=await api('state');placeMagnesiumLast();mainScreen();separateMagnesium();restorePulsingHeart();updateReminderScheduleText();addMonitorPinButton();addAutoLockSettings();await syncAppBadge()}catch{localStorage.removeItem('fsc_session');sessionToken='';loginScreen()}}
    (async()=>{try{const s=await api('status');if(!s.initialized){if(privateSetupToken())setupScreen();else app.innerHTML='<section class="card hero"><img src="icon.png"><h2>Setup link required</h2><p class="muted">Open the private setup link on the Monitor phone first.</p></section>'}else if(sessionToken&&!shouldLock())await load();else{if(sessionToken)lockApp();else loginScreen()}}catch(e){app.innerHTML='<section class="card"><b>Unable to open app</b><p>'+esc(e.message)+'</p></section>'}})();
    document.addEventListener('visibilitychange',()=>{if(document.hidden&&sessionToken){const hiddenAt=Date.now();localStorage.setItem('fsc_hidden_at',String(hiddenAt));clearTimeout(lockTimer);lockTimer=setTimeout(()=>{if(document.hidden)lockApp()},lockDelay()*1000)}else if(!document.hidden){clearTimeout(lockTimer);if(shouldLock())lockApp();else localStorage.removeItem('fsc_hidden_at')}});
    window.addEventListener('pagehide',()=>{if(sessionToken)localStorage.setItem('fsc_hidden_at',String(Date.now()))});
    document.addEventListener('input',async event=>{if(event.target?.id!=='pin')return;const input=event.target;input.value=input.value.replace(/\D/g,'').slice(0,4);const button=document.querySelector('#login');if(input.value.length!==4||!button||button.disabled)return;button.disabled=true;button.textContent='Unlocking…';try{const j=await api('login',{pin:input.value});sessionToken=j.token;localStorage.setItem('fsc_session',sessionToken);localStorage.removeItem('fsc_hidden_at');await load()}catch(e){document.querySelector('#err').textContent=e.message;button.disabled=false;button.textContent='Unlock app';input.select()}});
    if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  </script>
</body>
</html>
